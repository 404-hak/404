# Плановые предложения обновить зависимости выключены (open-pull-requests-limit: 0): в репозитории
# одна ветка main, обновления делаются вручную отдельной задачей с проверкой.
# Чтобы включить снова — вернуть лимит (например, 5). Крупные версии (React 19, Tailwind 4 и т. п.) не предлагаются.
version: 2
updates:
  - package-ecosystem: pip
    directory: /api
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      web-minor:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
