name: Проверка · API и дашборд

# На каждый пуш и pull request: тесты API, проверка типов и сборка дашборда, известные уязвимости зависимостей.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r requirements-dev.txt pip-audit
      - name: Тесты
        run: python -m pytest -q
      - name: Уязвимости зависимостей
        run: pip-audit -r requirements.txt

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Типы и сборка
        run: npm run build
      - name: Уязвимости зависимостей сайта (то, что уходит в браузер)
        run: npm audit --omit=dev --audit-level=high
