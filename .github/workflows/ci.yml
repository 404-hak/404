name: Проверка · API и дашборд

# На каждый пуш и pull request: тесты API, проверка типов и сборка дашборда, известные уязвимости зависимостей.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r requirements-dev.txt pip-audit
      - name: Тесты
        run: python -m pytest -q
      - name: Уязвимости зависимостей
        run: pip-audit -r requirements.txt

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Типы и сборка
        run: npm run build
      - name: Проверки функций (Vitest)
        run: npm test
      - name: Уязвимости зависимостей сайта (то, что уходит в браузер)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    # сквозные сценарии дежурного в настоящем браузере: дашборд, тревога → перехват, меню правой кнопки
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r api/requirements.txt
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: web
      - name: Сервер
        working-directory: api
        env: { DATA_DIR: /tmp/404-e2e, WEATHER: '0' }
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 1; done
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Сценарии
        working-directory: web
        run: npm run e2e
      - if: failure()
        run: tail -n 80 /tmp/api.log
