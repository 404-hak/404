name: Компьютер · Windows и macOS

# Собирает приложение 404 для компьютера (обёртка над дашбордом на Electron) и кладёт установщики
# в «Artifacts» запуска: Windows — установщик и переносная версия (.exe), macOS — .dmg для M1–M4 (arm64)
# и для Intel (x64). Подписей нет: см. раздел «Приложение для компьютера» в README.
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: Адрес сервера, вшиваемый в приложение (пусто — приложение спросит при первом запуске)
        required: false
        default: ''
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            files: |
              desktop/dist/*.exe
          - os: macos-15
            target: mac
            files: |
              desktop/dist/*.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    env:
      # приоритет: поле при ручном запуске → переменная репозитория SERVER_URL (Settings → Variables)
      SERVER_URL: ${{ github.event.inputs.server_url || vars.SERVER_URL }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Зависимости
        run: npm ci --no-audit --no-fund

      - name: Проверки
        run: |
          npm run check
          npm test

      - name: Адрес сервера в сборку
        if: env.SERVER_URL != ''
        shell: bash
        run: npm pkg set serverUrl="$SERVER_URL"

      - name: Сборка
        run: npx electron-builder --${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: 404-${{ matrix.target }}
          path: ${{ matrix.files }}
          if-no-files-found: error
